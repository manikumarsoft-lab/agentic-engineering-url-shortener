[project]
name = "agentic-url-shortener"
version = "0.1.0"
description = "Agentic Software Engineering System: URL Shortener (lean slice, HD-CUT-002)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
