# SCN-B compensation variant (fault-injection label): the alias change passes every pre-promotion check,
# is promoted to the local staging release after the human release decision, and a post-promotion
# smoke check fails (injected). Compensation re-promotes the previous release and lists the aliases
# created while the change was live; a human-approved corrective action disables them.
# Contrast with scn-b-defective: there the failure happens BEFORE promotion and is handled by ROLLBACK.
name: scn-b-compensate
version: 1.0.0
workspace:
  include: [src, tests/shortener, specs/001-agentic-sdlc-url-shortener/contracts/shortener-api.openapi.yaml, pyproject.toml]
defaults: {timeout_s: 120, max_attempts: 3, backoff_s: 1, gate_timeout_s: 86400}
nodes:
  - {id: intake, agent: ingest, params: {requirement: scenarios/scn-b/requirement.md}, produces: [requirement]}
  - {id: normalize, agent: normalize, consumes: [requirement], produces: [normalized-requirement], depends_on: [intake]}
  - {id: quality, agent: quality_check, consumes: [normalized-requirement], produces: [quality-report], depends_on: [normalize]}
  - id: clarify
    gate:
      kind: clarify
      roles: [engineer, approver]
      binds: [quality-report]
      options: {W: {label: Withdraw the request, action: abort}}
    conditional: {fact: clarification_needed, equals: true}
    skip_reason: all five requirement-quality checks passed; no clarification required
    depends_on: [quality]
  - {id: impact, agent: impact_analysis, consumes: [normalized-requirement], produces: [impact-analysis], depends_on: [clarify]}
  - {id: decompose, agent: decompose, consumes: [normalized-requirement], produces: [task-plan], depends_on: [impact]}
  - {id: design, agent: design, params: {change_set: scenarios/scn-b/changeset}, consumes: [normalized-requirement, task-plan, impact-analysis], produces: [design], depends_on: [decompose]}
  - id: approve-design
    gate: {roles: [approver], binds: [design, impact-analysis, task-plan], rework_target: design}
    depends_on: [design]
  - {id: tdd-red, agent: apply_tests, params: {change_set: scenarios/scn-b/changeset}, produces: [test-red], depends_on: [approve-design], timeout_s: 300}
  - {id: implement, agent: apply_impl, params: {change_set: scenarios/scn-b/changeset}, consumes: [impact-analysis], produces: [change-application], depends_on: [tdd-red]}
  - {id: test, agent: run_tests, params: {change_set: scenarios/scn-b/changeset}, produces: [test-results], depends_on: [implement], on_failure: rollback, timeout_s: 300}
  - {id: docs, agent: write_docs, consumes: [design, test-results], produces: [docs], depends_on: [test]}
  - {id: threat-review, agent: threat_review, consumes: [design], produces: [threat-review], depends_on: [test]}
  - {id: validate, agent: validate_release, params: {change_set: scenarios/scn-b/changeset}, consumes: [test-results, threat-review], depends_on: [docs, threat-review], policy_checks: [PRIV-001, SEC-002, SEC-003, SEC-004, REL-001]}
  - id: approve-release
    gate: {roles: [release-owner], binds: [test-results, threat-review, docs]}
    depends_on: [validate]
  - id: promote
    agent: promote
    produces: [release, compensation-record]
    compensate: {agent: restore_previous_release}
    depends_on: [approve-release]
  - {id: smoke, agent: smoke_check, produces: [smoke-result], depends_on: [promote], on_failure: compensate, failure_edge: approve-corrective}
  - id: approve-corrective
    gate: {roles: [approver], binds: [compensation-record]}
    depends_on: [smoke]
  - {id: corrective, agent: disable_effects, consumes: [compensation-record], produces: [corrective-action], depends_on: [approve-corrective]}
# The engine writes the final engineering summary for every outcome (FR-ORC-026).
