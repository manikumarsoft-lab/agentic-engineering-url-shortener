# SCN-C ambiguous: "track who clicks links" (HD-SCN-001). The run blocks at the clarification gate;
# the human's option selects the change set from scenarios/scn-c/catalog.yaml (option_id key).
# Free text is never interpreted: it reopens clarification, and a second free-text answer safe-stops.
name: scn-c
version: 1.0.0
workspace:
  include: [src, tests/shortener, specs/001-agentic-sdlc-url-shortener/contracts/shortener-api.openapi.yaml, pyproject.toml]
defaults: {timeout_s: 120, max_attempts: 3, backoff_s: 1, gate_timeout_s: 86400}
nodes:
  - {id: intake, agent: ingest, params: {requirement: scenarios/scn-c/requirement.md}, produces: [requirement]}
  - {id: normalize, agent: normalize, consumes: [requirement], produces: [normalized-requirement], depends_on: [intake]}
  - {id: quality, agent: quality_check, consumes: [normalized-requirement], produces: [quality-report], depends_on: [normalize]}
  - id: clarify
    gate:
      kind: clarify
      roles: [engineer, approver]
      binds: [quality-report]
      max_rounds: 2
      options:
        A: {label: "Daily aggregate click counts per link (UTC), no personal data (recommended)"}
        C: {label: Withdraw the request, action: abort}
    conditional: {fact: clarification_needed, equals: true}
    skip_reason: all five requirement-quality checks passed; no clarification required
    depends_on: [quality]
  - {id: select, agent: select_change_set, params: {catalog: scenarios/scn-c/catalog.yaml}, consumes: [clarification], produces: [normalized-requirement, change-set-selection], depends_on: [clarify], on_failure: fail_run}
  - {id: requality, agent: quality_check, consumes: [normalized-requirement], produces: [quality-report], depends_on: [select], policy_checks: [PRIV-001]}
  - {id: decompose, agent: decompose, consumes: [normalized-requirement], produces: [task-plan], depends_on: [requality]}
  - {id: design, agent: design, consumes: [normalized-requirement, task-plan], produces: [design], depends_on: [decompose]}
  - id: approve-design
    gate: {roles: [approver], binds: [design, task-plan, change-set-selection], rework_target: design}
    depends_on: [design]
  - {id: tdd-red, agent: apply_tests, produces: [test-red], depends_on: [approve-design], timeout_s: 300}
  - {id: implement, agent: apply_impl, produces: [change-application], depends_on: [tdd-red]}
  - {id: test, agent: run_tests, produces: [test-results], depends_on: [implement], on_failure: rollback, timeout_s: 300}
  - {id: docs, agent: write_docs, consumes: [design, test-results], produces: [docs], depends_on: [test]}
  - {id: threat-review, agent: threat_review, consumes: [design], produces: [threat-review], depends_on: [test]}
  - {id: validate, agent: validate_release, consumes: [test-results, threat-review], depends_on: [docs, threat-review], policy_checks: [PRIV-001, SEC-002, SEC-003, SEC-004, REL-001]}
  - id: approve-release
    gate: {roles: [release-owner], binds: [test-results, threat-review, docs]}
    depends_on: [validate]
  - {id: release, agent: release, produces: [release], depends_on: [approve-release]}
# The engine writes the final engineering summary for every outcome (FR-ORC-026).
